name: Test Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: chill-lang-ci
  PROJECT_NAME: Chill-Lang CI
  SECRET_KEY: ci-only-signing-key-not-used-outside-tests-123456789
  FIRST_SUPERUSER: ci-admin@example.com
  FIRST_SUPERUSER_PASSWORD: ci-only-password-for-tests
  POSTGRES_PASSWORD: ci-only-db-password
  DATABASE_URL: postgresql://postgres:ci-only-db-password@localhost:5432/app
  FASTAPI_ENV: development
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_TLS: "false"
  EMAILS_FROM_EMAIL: ci@example.com
  OPENAI_ENABLED: "false"
  OPENAI_API_KEY: ""

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          cache-dependency-glob: |
            pyproject.toml
            backend/pyproject.toml
            uv.lock
      - name: Install locked backend dependencies
        run: uv sync --frozen --package app
      - name: Start disposable database and Mailpit
        run: docker compose up -d --wait db mailpit
      - name: Prepare database
        working-directory: backend
        run: uv run --frozen bash scripts/prestart.sh
      - name: Run backend tests and coverage
        working-directory: backend
        env:
          COVERAGE_TITLE: Coverage for ${{ github.sha }}
        run: uv run --frozen bash scripts/tests-start.sh "$COVERAGE_TITLE"
      - name: Check coverage threshold
        working-directory: backend
        run: uv run --frozen coverage report --fail-under=90
      - name: Store coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
