name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: chill-lang-ci
  PROJECT_NAME: Chill-Lang CI
  SECRET_KEY: ci-only-signing-key-not-used-outside-tests-123456789
  FIRST_SUPERUSER: ci-admin@example.com
  FIRST_SUPERUSER_PASSWORD: ci-only-password-for-tests
  POSTGRES_PASSWORD: ci-only-db-password
  DATABASE_URL: postgresql://postgres:ci-only-db-password@localhost:5432/app
  FASTAPI_ENV: development
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_TLS: "false"
  EMAILS_FROM_EMAIL: ci@example.com
  OPENAI_ENABLED: "false"
  OPENAI_API_KEY: ""
  COMPOSE_FILE: compose.yml:compose.override.yml:.github/compose.ci.yml
  CI: "true"

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - 'backend/**'
              - 'frontend/**'
              - 'packages/**'
              - 'scripts/**'
              - 'dev.sh'
              - 'compose*.yml'
              - '.github/compose.ci.yml'
              - '.github/workflows/playwright.yml'
              - '.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'

  test-playwright:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application and browser images once
        run: docker compose build backend playwright
      - name: Start disposable database and Mailpit
        run: docker compose up -d --wait db mailpit
      - name: Prepare database
        run: docker compose run --rm --no-deps backend bash scripts/prestart.sh
      - name: Start application
        run: docker compose up -d --no-build --wait backend
      - name: Check API and frontend
        run: |
          curl --fail --silent --show-error --location http://localhost:8000/api/v1/utils/health-check/
          curl --fail --silent --show-error http://localhost:8000/
      - name: Run browser tests
        run: docker compose run --rm --no-deps playwright bunx --no-install playwright test --workers=1 --fail-on-flaky-tests --trace=retain-on-failure --reporter=list,html
      - name: Store browser reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Keep the existing required-check name, including explicit allowed skips.
  alls-green-playwright:
    if: always()
    needs: [changes, test-playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check browser job result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.changed }}
          RESULT: ${{ needs.test-playwright.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RESULT" = success ]; then
            exit 0
          fi
          if [ "$EVENT" != workflow_dispatch ] && [ "$CHANGED" = false ] && [ "$RESULT" = skipped ]; then
            exit 0
          fi
          exit 1
