name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          cache-dependency-glob: |
            pyproject.toml
            backend/pyproject.toml
            uv.lock
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Check Python lockfile consistency
        run: uv lock --check
      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-packages
          bun ci
      - name: Backend quality checks
        working-directory: backend
        run: |
          uv run --frozen ruff check app tests
          uv run --frozen ruff format app tests --check
          uv run --frozen mypy app
          uv run --frozen ty check app
      - name: Frontend quality and types
        working-directory: frontend
        run: |
          bunx --no-install biome check src tests
          bunx --no-install tsc --noEmit -p tsconfig.json
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: bun run build

  # Keep this existing check name for branch-protection compatibility.
  pre-commit-alls-green:
    if: always()
    needs: [pre-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check quality job result
        env:
          RESULT: ${{ needs.pre-commit.result }}
        run: test "$RESULT" = success
